<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Kasir Toko Modern</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      body {
        background-color: #f1f5f9;
        color: #334155;
        display: flex;
        justify-content: center;
        padding: 20px;
      }
      .pos-container {
        display: flex;
        gap: 20px;
        width: 100%;
        max-width: 1100px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        overflow: hidden;
        padding: 20px;
      }
      .produk-section {
        flex: 2;
      }
      .section-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 15px;
        color: #0f172a;
        border-bottom: 2px solid #e2e8f0;
        padding-bottom: 8px;
      }
      .grid-produk {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 12px;
      }
      .card-produk {
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .card-produk:hover {
        border-color: #2563eb;
        background-color: #eff6ff;
        transform: translateY(-2px);
      }
      .card-produk h4 {
        font-size: 0.95rem;
        margin-bottom: 6px;
        color: #1e293b;
      }
      .card-produk p {
        font-size: 0.85rem;
        color: #2563eb;
        font-weight: 600;
      }
      .keranjang-section {
        flex: 1.2;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 15px;
        display: flex;
        flex-direction: column;
      }
      .tabel-keranjang {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
      }
      .tabel-keranjang th,
      .tabel-keranjang td {
        text-align: left;
        padding: 8px;
        font-size: 0.85rem;
        border-bottom: 1px solid #e2e8f0;
      }
      .tabel-keranjang th {
        color: #64748b;
      }
      .area-total {
        margin-top: auto;
        border-top: 2px dashed #cbd5e1;
        padding-top: 12px;
      }
      .row-total {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        font-size: 1.1rem;
        margin-bottom: 15px;
        color: #0f172a;
      }
      .btn-bayar {
        width: 100%;
        background: #16a34a;
        color: white;
        border: none;
        padding: 12px;
        border-radius: 6px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-bayar:hover {
        background: #15803d;
      }
      .btn-reset {
        width: 100%;
        background: #dc2626;
        color: white;
        border: none;
        padding: 8px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        margin-top: 8px;
      }
      .pesan-sukses {
        color: #16a34a;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="pos-container">
      <div class="produk-section">
        <h2 class="section-title">Daftar Menu / Produk</h2>
        <div class="grid-produk">
          <div
            class="card-produk"
            onclick="tambahKeKeranjang('Kopi Hitam', 10000)"
          >
            <h4>Kopi hitam</h4>
            <p>Rp 10.000</p>
          </div>
          <div
            class="card-produk"
            onclick="tambahKeKeranjang('Es Teh Manis', 5000)"
          >
            <h4>Es Teh Manis</h4>
            <p>Rp 5.000</p>
          </div>
          <div
            class="card-produk"
            onclick="tambahKeKeranjang('Roti Bakar', 12000)"
          >
            <h4>Roti Bakar</h4>
            <p>Rp 12.000</p>
          </div>
          <div
            class="card-produk"
            onclick="tambahKeKeranjang('Mie Goreng', 15000)"
          >
            <h4>Mie Goreng</h4>
            <p>Rp 15.000</p>
          </div>
          <div
            class="card-produk"
            onclick="tambahKeKeranjang('Air Mineral', 4000)"
          >
            <h4>Air Mineral</h4>
            <p>Rp 4.000</p>
          </div>
        </div>
      </div>
      <div class="keranjang-section">
        <h2 class="section-title">Struk Kasir</h2>
        <table class="tabel-keranjang">
          <thead>
            <tr>
              <th>Item</th>
              <th>Qty</th>
              <th>Harga</th>
            </tr>
          </thead>
          <tbody id="isi-keranjang"></tbody>
        </table>
        <div class="area-total">
          <div class="row-total">
            <span>Total:</span>
            <span id="text-total">Rp 0</span>
          </div>
          <button class="btn-bayar" id="btn-proses" onclick="prosesBayar()">
            Proses Pembayaran
          </button>
          <button class="btn-reset" onclick="resetKeranjang()">
            Kosongkan keranjang
          </button>
          <p id="pesan-status" class="pesan-sukses"></p>
        </div>
      </div>
    </div>
    <script>
      let keranjang = [];
      let totalHarga = 0;
      function tambahKeKeranjang(namaItem, hargaItem) {
        keranjang.push({ nama: namaItem, harga: hargaItem });
        totalHarga += hargaItem;
        perbaruiTampilan();
      }
      function perbaruiTampilan() {
        const tabel = document.getElementById("isi-keranjang");
        const textTotal = document.getElementById("text-total");
        const pesanStatus = document.getElementById("pesan-status");

        pesanStatus.innerText = "";
        tabel.innerHTML = "";

        // Mengelompokkan item atau menampilkan daftar
        keranjang.forEach((item) => {
          const row = document.createElement("tr");
          row.innerHTML = `
          <td>${item.nama}</td>
          <td>1</td>
          <td>Rp ${item.harga.toLocaleString("id-ID")}</td>
        `;
          tabel.appendChild(row);
        });

        textTotal.innerText = `Rp ${totalHarga.toLocaleString("id-ID")}`;
      }

      // Fungsi Bayar
      function prosesBayar() {
        const pesanStatus = document.getElementById("pesan-status");

        if (keranjang.length === 0) {
          pesanStatus.style.color = "#dc2626";
          pesanStatus.innerText = "Keranjang masih kosong!";
          return; // Menghentikan fungsi jika keranjang kosong
        }

        pesanStatus.style.color = "#16a34a";
        pesanStatus.innerText = "Transaksi Berhasil!";
        keranjang = [];
        totalHarga = 0;

        setTimeout(() => {
          perbaruiTampilan();
        }, 1500);
      }

      // Fungsi Reset
      function resetKeranjang() {
        keranjang = [];
        totalHarga = 0;
        perbaruiTampilan();
      }
    </script>
  </body>
</html>
